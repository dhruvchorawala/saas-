services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/price_compare
      - JWT_SECRET=change_me_to_a_long_random_string
      - JWT_EXPIRE=30d
      - JWT_COOKIE_EXPIRE=30
      - CLIENT_URL=http://localhost:3000
      - REFRESH_INTERVAL_HOURS=6
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
